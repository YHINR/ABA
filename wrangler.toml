name = "trivia-ivr"
main = "trivia-worker.js"
compatibility_date = "2024-01-01"

# יש ליצור את ה-namespace פעם אחת עם הפקודה:
#   npx wrangler kv namespace create TRIVIA_KV
# ואז להעתיק לכאן את ה-id שיוחזר
[[kv_namespaces]]
binding = "TRIVIA_KV"
id = "ba75425c712040678e54c58c0eff1d9c"

# לוג בגיטהב: יש להחליף את YHINR/ABA בשם המשתמש ושם הריפו, למשל "moshe/trivia"
# את הטוקן (GITHUB_TOKEN) מגדירים כ-secret ולא כותבים כאן
[vars]
GITHUB_REPO = "YHINR/ABA"
GITHUB_LOG_BRANCH = "logs"
GITHUB_BASE_BRANCH = "main"
